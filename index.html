<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dar-Connect</title>
    <script>
      // Global error handlers to surface runtime issues instead of a white screen
      window.addEventListener('error', (e) => {
        document.addEventListener('DOMContentLoaded', ()=>{
          document.body.style.background = '#fff';
          document.body.innerHTML = '<pre style="white-space:pre-wrap;color:#900;padding:16px">Runtime Error:\n' + (e.error && e.error.stack ? e.error.stack : e.message) + '</pre>'
        })
      })
      window.addEventListener('unhandledrejection', (ev) => {
        document.addEventListener('DOMContentLoaded', ()=>{
          document.body.style.background = '#fff';
          document.body.innerHTML = '<pre style="white-space:pre-wrap;color:#900;padding:16px">Unhandled Rejection:\n' + (ev.reason && ev.reason.stack ? ev.reason.stack : ev.reason) + '</pre>'
        })
      })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
